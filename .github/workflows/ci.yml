name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  order-service:
    name: order-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: order-service
        run: ./mvnw -B verify

  payment-service:
    name: payment-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: payment-service
        run: ./mvnw -B verify

  inventory-service:
    name: inventory-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: inventory-service
        run: ./mvnw -B verify

  notification-service:
    name: notification-service (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        working-directory: notification-service
        run: ./mvnw -B verify

  compose-build:
    name: Validate compose build
    runs-on: ubuntu-latest
    needs: [order-service, payment-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local secrets
        run: |
          mkdir -p secrets
          echo "ci-postgres-password" > secrets/postgres_password.txt
      - name: Build all images
        run: docker compose -f podman-compose.yml build
